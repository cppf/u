name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v

      - name: Verify deploy_config.py placeholder is still a placeholder in CI
        run: |
          if ! grep -q 'REPLACE_WITH_YOUR_BOT_TOKEN_FROM_BOTFATHER' deploy_config.py; then
            echo "::notice::deploy_config.py has been edited with a real token — make sure this repo is private before pushing a real BOT_TOKEN to source control."
          fi

  docker-build:
    name: Docker build (deploy image)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — validates the Dockerfile builds cleanly)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: monospace-bot-python:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
